IssueTracker: https://github.com/werimsoln/MultiBooter/issues

AutoName: MultiBooter

RepoType: git
Repo: https://github.com/werimsoln/MultiBooter.git

Builds:
  - versionName: v0.1.0
    versionCode: 1000
    commit: e9eb1d67ec4f3726a24cec5e3140942f572ee670

    srclibs:
      - Ventoy@v1.1.17

    output: app-release-unsigned.apk

    prebuild:
      - apt-get update
      - apt-get install -y dosfstools faketime mtools
      - test -d "$$Ventoy$$/INSTALL"
      - mkdir -p src/main/assets/ventoy
      - test -f src/main/assets/ventoy.disk.img
      - |
        for f in \
          BOOTX64.EFI \
          BOOTIA32.EFI \
          BOOTAA64.EFI \
          ventoy_x64.efi
        do
          test -f "$$Ventoy$$/INSTALL/EFI/BOOT/$f"
          mcopy -i src/main/assets/ventoy.disk.img \
            "::EFI/BOOT/$f" \
            "src/main/assets/ventoy/$f" || true
        done

    build:
      - chmod +x build.sh
      - VENTOY_SRC="$$Ventoy$$" ./build.sh

    ndk: 30.0.16248370

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: v0.1.0
CurrentVersionCode: 1000
