Builds:
  - versionName: v0.1.0
    versionCode: 1000
    commit: d61588bab9749f8242f65bb299cc2509aae6c8ac
    output: app-release-unsigned.apk
    srclibs:
      - Ventoy@v1.1.17
    prebuild:
      - apt-get update
      - apt-get install -y dosfstools faketime mtools
      - test -d "$$Ventoy$$/INSTALL"
      - mkdir -p src/main/assets/ventoy
      - test -f src/main/assets/ventoy.disk.img
      - "for f in \\\n  BOOTX64.EFI \\\n  BOOTIA32.EFI \\\n  BOOTAA64.EFI \\\n  ventoy_x64.efi\n\
        do\n  test -f \"$$Ventoy$$/INSTALL/EFI/BOOT/$f\"\n  mcopy -i src/main/assets/ventoy.disk.img\
        \ \\\n    \"::EFI/BOOT/$f\" \\\n    \"src/main/assets/ventoy/$f\" || true\n\
        done\n"
    build:
      - chmod +x build.sh
      - VENTOY_SRC="$$Ventoy$$" ./build.sh
    ndk: 30.0.16248370

