AutoName: MultiBooter

Summary: Create bootable USB media or boot directly from Android
Description: |-
  Create bootable USB or boot from Android.

Features:

- Direct booting from the device thanks to the Linux Kernel's ConfigFS and Mass Storage features.

- Direct booting from the device via a TFTP server.

- Booting from USB via Ventoy.

- Booting from USB via a bootable CD-ROM image.

- Direct booting from the device thanks to the Linux Kernel's ConfigFS and FunctionFS features. (Coming Soon)

  This app is completely free, open-source, and does not use any proprietary libraries (No AndroidX).

